services:
  postgres:
    image: postgres:16-alpine
    container_name: cinepvq-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cinepvq
      POSTGRES_USER: cinepvq_user
      POSTGRES_PASSWORD: cinepvq_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinepvq_user -d cinepvq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
