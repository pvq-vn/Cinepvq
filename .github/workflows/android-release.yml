name: Build & Release Cinepvq Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as official GitHub Release (true to publish, false to test build/sign only)'
        required: false
        default: 'false'
      force_update:
        description: 'Mark this release as mandatory/forced update (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Canonical APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup & Validate Release Keystore
        id: setup_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Verify all required secrets exist
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret in repository settings!"
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing KEYSTORE_PASSWORD secret in repository settings!"
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing KEY_ALIAS secret in repository settings!"
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing KEY_PASSWORD secret in repository settings!"
            exit 1
          fi

          # 2. Decode keystore to an unambiguous absolute path
          KEYSTORE_PATH="$GITHUB_WORKSPACE/cinepvq-android/release.keystore"
          echo "Decoding release keystore to $KEYSTORE_PATH..."
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

          # 3. Verify file exists, is non-empty, and readable
          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore file does not exist or is empty at $KEYSTORE_PATH!"
            exit 1
          fi
          if [ ! -r "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore file is not readable at $KEYSTORE_PATH!"
            exit 1
          fi

          # 4. Verify keystore integrity and alias without leaking passwords
          echo "Verifying keystore integrity and alias '$KEY_ALIAS' with keytool..."
          keytool -list -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" > /dev/null
          echo "Keystore and alias verified successfully."

          # 5. Export deterministic absolute path to GITHUB_ENV
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Build Release APK
        working-directory: cinepvq-android
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Hard Validation & Cryptographic Signature Verification
        run: |
          RELEASE_DIR="cinepvq-android/app/build/outputs/apk/release"
          echo "Listing release outputs directory:"
          ls -la "$RELEASE_DIR"

          # 1. Fail immediately if assembleRelease produced an unsigned APK
          if [ -f "$RELEASE_DIR/app-release-unsigned.apk" ] && [ ! -f "$RELEASE_DIR/app-release.apk" ]; then
            echo "::error::assembleRelease produced app-release-unsigned.apk! Signing configuration was not applied."
            exit 1
          fi

          SIGNED_APK="$RELEASE_DIR/app-release.apk"
          if [ ! -f "$SIGNED_APK" ]; then
            # Search for any non-unsigned apk
            SIGNED_APK=$(find "$RELEASE_DIR" -type f -name "*.apk" ! -name "*unsigned*.apk" | head -n 1)
          fi

          if [ -z "$SIGNED_APK" ] || [ ! -f "$SIGNED_APK" ]; then
            echo "::error::Signed APK not found in $RELEASE_DIR!"
            exit 1
          fi

          echo "Found signed APK candidate at: $SIGNED_APK"

          # 2. Locate apksigner and verify cryptographic signature
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER_BIN" ]; then
            echo "::error::apksigner tool not found in $ANDROID_HOME/build-tools!"
            exit 1
          fi

          echo "Running cryptographic verification using: $APKSIGNER_BIN"
          $APKSIGNER_BIN verify --verbose --print-certs "$SIGNED_APK"
          if [ $? -ne 0 ]; then
            echo "::error::apksigner verification FAILED! APK is not properly signed."
            exit 1
          fi
          echo "apksigner verification PASSED."

          # 3. Print certificate SHA-256 digest
          CERT_FINGERPRINT=$($APKSIGNER_BIN verify --print-certs "$SIGNED_APK" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}')
          echo "APK Signer Certificate SHA-256: $CERT_FINGERPRINT"

          # 4. Prepare canonical Cinepvq.apk and SHA-256 checksum
          cp "$SIGNED_APK" Cinepvq.apk
          sha256sum Cinepvq.apk | awk '{print $1}' > Cinepvq.apk.sha256
          SHA256_VAL=$(cat Cinepvq.apk.sha256)
          echo "Canonical APK SHA-256: $SHA256_VAL"
          echo "APK_SHA256=$SHA256_VAL" >> $GITHUB_ENV
          echo "APK_CERT_SHA256=$CERT_FINGERPRINT" >> $GITHUB_ENV

          # 5. Extract metadata (versionCode, versionName) with aapt
          AAPT_BIN=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          if [ -n "$AAPT_BIN" ]; then
            BADGING=$($AAPT_BIN dump badging Cinepvq.apk)
            V_CODE=$(echo "$BADGING" | grep -o "versionCode='[^']*'" | head -n 1 | cut -d"'" -f2)
            V_NAME=$(echo "$BADGING" | grep -o "versionName='[^']*'" | head -n 1 | cut -d"'" -f2)
            echo "Extracted versionCode: $V_CODE, versionName: $V_NAME"
            echo "APK_VERSION_CODE=$V_CODE" >> $GITHUB_ENV
            echo "APK_VERSION_NAME=$V_NAME" >> $GITHUB_ENV
          else
            echo "APK_VERSION_CODE=1" >> $GITHUB_ENV
            echo "APK_VERSION_NAME=1.0.0" >> $GITHUB_ENV
          fi

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cinepvq-Android-Signed
          path: |
            Cinepvq.apk
            Cinepvq.apk.sha256
          if-no-files-found: error

      - name: Create GitHub Release & Upload Asset
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cinepvq Android ${{ env.APK_VERSION_NAME || github.ref_name }}
          body: |
            ### Cinepvq Android Official Release (${{ env.APK_VERSION_NAME || github.ref_name }})
            
            - **Application ID**: `com.pvq.cinepvq`
            - **Version Code**: `${{ env.APK_VERSION_CODE }}`
            - **Version Name**: `${{ env.APK_VERSION_NAME }}`
            - **Tải trực tiếp**: [Cinepvq.apk](https://github.com/pvq-vn/Cinepvq/releases/download/${{ github.ref_name }}/Cinepvq.apk)
            - **Mã băm APK (SHA-256)**: `${{ env.APK_SHA256 }}`
            - **Chứng chỉ ký (Certificate SHA-256)**: `${{ env.APK_CERT_SHA256 }}`
            - **Chữ ký**: ✅ Cryptographically Signed & Verified (`apksigner`)
            
            #### Cấu hình Metadata Update API:
            Cập nhật biến môi trường backend Vercel:
            - `APP_LATEST_VERSION_CODE`: `${{ env.APK_VERSION_CODE }}`
            - `APP_LATEST_VERSION_NAME`: `${{ env.APK_VERSION_NAME }}`
            - `APP_LATEST_DOWNLOAD_URL`: `https://github.com/pvq-vn/Cinepvq/releases/download/${{ github.ref_name }}/Cinepvq.apk`
            - `APP_LATEST_SHA256`: `${{ env.APK_SHA256 }}`
            - `APP_FORCE_UPDATE`: `${{ github.event.inputs.force_update || 'false' }}`
          files: |
            Cinepvq.apk
            Cinepvq.apk.sha256
          draft: false
          prerelease: false

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/cinepvq-android/release.keystore" cinepvq-android/release.keystore
